{% extends "base.html" %}
{% block title %}Profile - InterviewAI{% endblock %}
{% block body %}
<div class="app-shell">
  {% include "sidebar.html" %}
  <main class="main-content">
    <header class="topbar">
      <div class="greeting"><h2>Profile</h2><p>Manage your account details.</p></div>
    </header>
    <section class="card profile-card">
      <div class="profile-avatar" id="profileAvatar">S</div>
      <div>
        <h3 id="profileName">—</h3>
        <p id="profileEmail" class="muted">—</p>
        <p id="profileJoined" class="muted small">—</p>
      </div>
    </section>
    <section class="card">
      <button class="btn btn-danger" onclick="logoutUser(event)">Log Out</button>
    </section>
  </main>
</div>
<script>
(async function(){
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (res.ok) {
      const u = data.user;
      document.getElementById('profileName').textContent = u.name;
      document.getElementById('profileEmail').textContent = u.email;
      document.getElementById('profileAvatar').textContent = u.name.charAt(0).toUpperCase();
      document.getElementById('profileJoined').textContent = 'Member since ' + (u.created_at || '');
    }
  } catch(e) {}
})();
</script>
{% endblock %}
